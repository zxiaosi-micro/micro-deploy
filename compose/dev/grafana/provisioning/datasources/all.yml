# S2-02 · Grafana 数据源 provisioning（免手配）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: micro-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Loki
    uid: micro-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 日志 trace_id → Jaeger 跳转（logx JSON 字段为 trace，v1.10.x）
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace":"([0-9a-f]+)"'
          datasourceUid: micro-jaeger
          url: "$${__value.raw}"
  - name: Jaeger
    uid: micro-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  - name: Pyroscope
    uid: micro-pyroscope
    type: pyroscope
    access: proxy
    url: http://pyroscope:4040
