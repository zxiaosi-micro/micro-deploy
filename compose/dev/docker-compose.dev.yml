# =====================================================================
# micro-dev · 全量开发环境（S2-01/S2-02，NFR-ENV-001）
# ---------------------------------------------------------------------
# 用法（本机零安装，一条命令拉起）：
#   cp .env.example .env && 填入 MICRO_DEV_* 强随机密码
#   docker compose up -d                  # profile 由 .env 的 COMPOSE_PROFILES 控制
#   COMPOSE_PROFILES=core docker compose up -d   # 仅 core（5 容器）
#
# 端口规则：宿主机端口 = 官方默认 + 20000（v4/02 §5.3，+20000 规则）。
#   本表与 micro-deploy/env.md、v4/02 §5.3 三处双登记——冲突 +1 顺延时三处同步回写（E12）。
#   2026-10-07 netstat 核对 22379~38083 号段：仅 33060 被占（本机 MySQL X 协议端口，非本项目取号），无冲突。
#
# 镜像 tag 写死小版本（不用 latest）。2026-10-07 选版说明：
#   - etcd 官方镜像 ghcr 通道无 3.7 tag，quay.io/coreos/etcd:v3.7.0 可用（满足 v4/02 §5.3 etcd:3.7 口径）
#   - MinIO 官方 minio/minio 已于 2025-03 撤出 Docker Hub、quay 转私有；
#     改用 bitnamilegacy 冻结版（仅 dev；生产走云 OSS，切换点 v4/04 §2 B1）
#   - APISIX 官方镜像 tag 均带 OS 后缀：3.11.0-debian
#
# 明确不引入（ADR-10/12/18 + v4/04 §2 切换点表，先登记再起）：
#   RocketMQ / Nacos / Beanstalkd / Gotenberg(预留 23001) / 延迟队列
# =====================================================================
name: micro-dev

networks:
  # 全部服务挂 default 网络，将其命名为 micro-dev-net（v4/02 §15.2：独立网络与旧环境零共享）
  default:
    name: micro-dev-net

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  tdengine-data:
  kafka-data:
  emqx-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  pyroscope-data:

services:
  # ---------------------------------------------------------------
  # core profile（5）：业务依赖，日常开发必开
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0.43
    container_name: micro-dev-mysql
    restart: unless-stopped
    profiles: [core]
    ports:
      - "127.0.0.1:23306:3306"        # MySQL 3306 → 23306（root 仅人工；应用账号见 init 脚本）
    environment:
      MYSQL_ROOT_PASSWORD: ${MICRO_DEV_MYSQL_ROOT_PW}
      TZ: Asia/Shanghai
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro   # 首启（卷为空时）执行：建应用账号授权 micro_% 库
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7.4.5
    container_name: micro-dev-redis
    restart: unless-stopped
    profiles: [core]
    ports:
      - "127.0.0.1:26379:6379"        # Redis 6379 → 26379（requirepass；DB0/1/3/4 划分见 v4/02 §6.3）
    command: ["sh", "-c", 'exec redis-server --requirepass "$$MICRO_DEV_REDIS_PW"']
    env_file:
      - .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$MICRO_DEV_REDIS_PW\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  etcd:
    image: quay.io/coreos/etcd:v3.7.0
    container_name: micro-dev-etcd
    restart: unless-stopped
    profiles: [core]
    ports:
      - "127.0.0.1:22379:2379"        # etcd 2379 → 22379（服务发现 + worker_id + configcenter + APISIX 存储）
      - "127.0.0.1:22380:2380"        # etcd 2380 → 22380（peer，单机预留）
    command:
      - etcd
      - --name=dev1
      - --data-dir=/var/lib/etcd
      - --advertise-client-urls=http://127.0.0.1:22379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=dev1=http://etcd:2380
    volumes:
      - etcd-data:/var/lib/etcd
    healthcheck:
      # 官方 3.7 镜像是 distroless（无 shell），只能 exec 形式
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  tdengine:
    image: tdengine/tdengine:3.3.6.13
    container_name: micro-dev-tdengine
    restart: unless-stopped
    profiles: [core]
    ports:
      - "127.0.0.1:26041:6041"        # TDengine REST 6041 → 26041（必须 Basic 认证，E7）
      - "127.0.0.1:26030:6030"        # TDengine 原生连接 6030 → 26030
    environment:
      TAOS_FQDN: tdengine
    env_file:
      - .env
    volumes:
      - tdengine-data:/var/lib/taos
    healthcheck:
      # 兼容"未改密(默认 taosdata)"与"已改密"两个阶段（改密由 tdengine-init 一次性完成）
      test: ["CMD-SHELL", 'taos -u root -p"$$MICRO_DEV_TDENGINE_PW" -s "show databases" || taos -u root -ptaosdata -s "show databases"']
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  tdengine-init:
    image: tdengine/tdengine:3.3.6.13
    container_name: micro-dev-tdengine-init
    restart: "no"
    profiles: [core]
    depends_on:
      tdengine:
        condition: service_healthy
    environment:
      MICRO_DEV_TDENGINE_PW: ${MICRO_DEV_TDENGINE_PW}
    volumes:
      - ./tdengine/init:/init:ro
    entrypoint: ["bash", "/init/01-change-password.sh"]

  kafka:
    image: apache/kafka:4.1.0
    container_name: micro-dev-kafka
    restart: unless-stopped
    profiles: [core]
    ports:
      - "127.0.0.1:29092:9092"        # Kafka 9092 → 29092（KRaft 单机，dev 免 ZooKeeper）
    environment:
      CLUSTER_ID: b1MjoJW0rdDYjcqJmkE-Rw     # 固定 cluster id：卷复用时跳过重复格式化
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # E3：advertised listener 必须是客户端可达地址。dev 下所有客户端跑在宿主机 → 127.0.0.1:29092。
      # 配错的症状 = 能连上但拿不到元数据（原 RocketMQ brokerIP1 教训随组件迁移沿用）。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # E2：topic 先建后用（tools/mqinit 预创建，S5-01）
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ---------------------------------------------------------------
  # edge profile（3 常驻 + 2 一次性 init）：网关与设备接入
  # ---------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.7
    container_name: micro-dev-emqx
    restart: unless-stopped
    profiles: [edge]
    ports:
      - "127.0.0.1:21883:1883"        # EMQX MQTT 1883 → 21883
      - "127.0.0.1:28883:8883"        # EMQX MQTT/TLS 8883 → 28883（生产唯一口径不变）
      - "127.0.0.1:38083:18083"       # EMQX Dashboard 18083 → 38083（WS 8083 不映射，OCPP 在 iotingest:8182）
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${MICRO_DEV_EMQX_DASHBOARD_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${MICRO_DEV_EMQX_DASHBOARD_PW}
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # E6：EMQX 认证器/ACL 随容器重建丢失 → bootstrap 幂等重跑。
  # 容器重建后执行：docker compose up emqx-bootstrap（幂等，可反复跑）
  emqx-bootstrap:
    image: curlimages/curl:8.12.1
    container_name: micro-dev-emqx-bootstrap
    restart: "no"
    profiles: [edge]
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      MICRO_DEV_EMQX_DASHBOARD_USER: ${MICRO_DEV_EMQX_DASHBOARD_USER}
      MICRO_DEV_EMQX_DASHBOARD_PW: ${MICRO_DEV_EMQX_DASHBOARD_PW}
      MICRO_DEV_EMQX_DEVICE_USER: ${MICRO_DEV_EMQX_DEVICE_USER}
      MICRO_DEV_EMQX_DEVICE_PW: ${MICRO_DEV_EMQX_DEVICE_PW}
      MICRO_DEV_EMQX_PLATFORM_USER: ${MICRO_DEV_EMQX_PLATFORM_USER:-micro-dev-platform}
      MICRO_DEV_EMQX_PLATFORM_PW: ${MICRO_DEV_EMQX_PLATFORM_PW:-}
    volumes:
      - ./emqx/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]

  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: micro-dev-apisix
    restart: unless-stopped
    profiles: [edge]
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:29080:9080"        # APISIX HTTP 代理 9080 → 29080
      - "127.0.0.1:29180:9180"        # APISIX Admin API 9180 → 29180（dev 权限：仅回环绑定）
    environment:
      MICRO_DEV_APISIX_ADMIN_KEY: ${MICRO_DEV_APISIX_ADMIN_KEY}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro   # etcd prefix=/apisix（v4/02 §7.4）
    healthcheck:
      # 镜像无 curl/wget、bash 未编译 /dev/tcp：用 /proc/net/tcp(6) 判 9080(hex 2378) LISTEN
      test: ["CMD", "/bin/bash", "-c", "awk '/:2378/ && / 0A /{f=1} END{exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: micro-dev-minio
    restart: unless-stopped
    profiles: [edge]
    ports:
      - "127.0.0.1:29000:9000"        # MinIO S3 API 9000 → 29000
      - "127.0.0.1:29001:9001"        # MinIO Console 9001 → 29001
    environment:
      MINIO_ROOT_USER: ${MICRO_DEV_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MICRO_DEV_MINIO_ROOT_PASSWORD}
      MINIO_EXTRA_ARGS: --console-address :9001
    volumes:
      - minio-data:/bitnami/minio/data    # Bitnami 版数据目录（与官方 /data 不同）
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 一次性：幂等建双桶（micro-file / micro-contract，合同桶开版本控制）
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: micro-dev-minio-init
    restart: "no"
    profiles: [edge]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MICRO_DEV_MINIO_ROOT_USER: ${MICRO_DEV_MINIO_ROOT_USER}
      MICRO_DEV_MINIO_ROOT_PASSWORD: ${MICRO_DEV_MINIO_ROOT_PASSWORD}
      MC_CONFIG_DIR: /tmp/.mc       # 非 root 用户，HOME 不可写，显式指到 /tmp
    volumes:
      - ./minio/init-buckets.sh:/init/init-buckets.sh:ro
    entrypoint: ["/bin/bash", "/init/init-buckets.sh"]

  # ---------------------------------------------------------------
  # obs profile（7）：可观测六件套 + Pyroscope（ADR-21/24）
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: micro-dev-prometheus
    restart: unless-stopped
    profiles: [obs]
    ports:
      - "127.0.0.1:29090:9090"        # Prometheus 9090 → 29090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro          # 三级告警规则（§11 告警基线）
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"                  # E17：抓宿主机服务 metrics 用 host.docker.internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: micro-dev-alertmanager
    restart: unless-stopped
    profiles: [obs]
    ports:
      - "127.0.0.1:29093:9093"        # Alertmanager 9093 → 29093（webhook → notification，S4-04 接入）
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:12.1.0
    container_name: micro-dev-grafana
    restart: unless-stopped
    profiles: [obs]
    ports:
      - "127.0.0.1:23000:3000"        # Grafana 3000 → 23000（provisioning 自动装配，免手配）
    environment:
      GF_SECURITY_ADMIN_USER: ${MICRO_DEV_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${MICRO_DEV_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    env_file:
      - .env
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || curl -sf http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  loki:
    image: grafana/loki:3.5.3
    container_name: micro-dev-loki
    restart: unless-stopped
    profiles: [obs]
    ports:
      - "127.0.0.1:23100:3100"        # Loki 3100 → 23100
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      # 该镜像 wget 不在 PATH（在 /busybox/ 下）
      test: ["CMD", "/busybox/wget", "-q", "-O-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  promtail:
    image: grafana/promtail:3.5.3
    container_name: micro-dev-promtail
    restart: unless-stopped
    profiles: [obs]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../../../micro-server/logs:/var/log/micro    # 采集 *_run.log（logx file 模式输出，E9 相对路径）
    healthcheck:
      # 镜像无 curl/wget、bash 未编译 /dev/tcp：用 /proc/net/tcp(6) 判 9080(hex 2378) LISTEN
      test: ["CMD", "/bin/bash", "-c", "awk '/:2378/ && / 0A /{f=1} END{exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  jaeger:
    image: jaegertracing/all-in-one:1.74.0
    container_name: micro-dev-jaeger
    restart: unless-stopped
    profiles: [obs]
    ports:
      - "127.0.0.1:36686:16686"       # Jaeger UI 16686 → 36686（带 trace_id 问人，v4/03 §使用说明）
      - "127.0.0.1:24317:4317"        # OTLP gRPC 4317 → 24317（go-zero Telemetry Batcher: otlpgrpc，E18）
      - "127.0.0.1:24318:4318"        # OTLP HTTP 4318 → 24318
    environment:
      COLLECTOR_OTLP_ENABLED: "true"   # E18：≥1.35 必须，否则 OTLP 不可用
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ADR-24 可选第 7 件：持续剖析（排障时随 obs profile 启动，常驻开销可接受即保持）
  pyroscope:
    image: grafana/pyroscope:1.13.0
    container_name: micro-dev-pyroscope
    restart: unless-stopped
    profiles: [obs]
    ports:
      - "127.0.0.1:24040:4040"        # Pyroscope 4040 → 24040
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    healthcheck:
      # 镜像是 distroless（无 shell/curl/wget），退化为"二进制可执行"级检查
      test: ["CMD", "/usr/bin/pyroscope", "-version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
