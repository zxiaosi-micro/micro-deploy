# TLS 443 单域名同域入口（证书 SAN 仅 zxiaosi.cn/www，DigiCert DV 至 2026-12-24；DNS 已指本机）
# 路径分发（三端均为极简 hash 路由，深度路由全在 # 后，无 BrowserRouter base 问题）：
#   /admin/  /dealer/  /station/   → 三端 Web 静态（vite --base=/admin/ 等构建）
#   /api/v1/                       → admin-bff:8889（三端 Web 同源调用）
#   /mapi/                         → mobile-bff:8890（小程序/运维 App，前缀改写 /mapi/* → /api/v1/*）
#   /                              → 302 /admin/
# APISIX（:80）保留 API 边缘与 Admin API 定位不变；8080-8083 端口面已收编至 443
server {
    listen 443 ssl;
    http2 on;
    server_name zxiaosi.cn www.zxiaosi.cn;

    ssl_certificate     /etc/nginx/certs/zxiaosi.cn.pem;
    ssl_certificate_key /etc/nginx/certs/zxiaosi.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    client_max_body_size 64m;

    location = /admin   { return 301 /admin/; }
    location = /dealer  { return 301 /dealer/; }
    location = /station { return 301 /station/; }

    location /admin/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /admin/index.html;
    }

    location /dealer/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /dealer/index.html;
    }

    location /station/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /station/index.html;
    }

    location /api/v1/ {
        proxy_pass http://admin-bff:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mapi/ {
        proxy_pass http://mobile-bff:8890/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = / {
        return 302 /admin/;
    }
}
