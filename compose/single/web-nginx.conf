# 三端 Web 静态 + /api/v1 同源反代 admin-bff:8889（BrowserRouter 需 SPA fallback）
# admin :8080 / dealer :8081 / station :8082

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/admin;
    index index.html;

    location /api/v1/ {
        proxy_pass http://admin-bff:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

